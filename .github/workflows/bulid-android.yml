name: Build Pixelorama Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

env:
  # تأكد من مطابقة هذا الإصدار مع رقم إصدار Godot الموجود في ملف project.godot لديك
  GODOT_VERSION: "4.7.1-stable"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download Godot & Export Templates
        run: |
          GODOT_TEMPLATE_DIR="${GODOT_VERSION/-/.}"
          mkdir -p ~/.local/bin
          mkdir -p ~/.local/share/godot/export_templates/"${GODOT_TEMPLATE_DIR}"

          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 ~/.local/bin/godot
          chmod +x ~/.local/bin/godot
          rm godot.zip

          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/"${GODOT_TEMPLATE_DIR}"/
          rm -rf templates templates.tpz

          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Android Debug Keystore & Godot Settings
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 \
            -deststoretype pkcs12

          MAJOR_MINOR=$(echo "${GODOT_VERSION}" | cut -d'.' -f1,2)
          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-${MAJOR_MINOR}.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp ~/.config/godot/editor_settings-${MAJOR_MINOR}.tres ~/.config/godot/editor_settings-4.tres

      - name: Prepare Android Export Preset
        run: |
          mkdir -p build
          cat << 'EOF' > export_presets.cfg
          [preset.0]

          name="AndroidAPK"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/pixelorama-virtual-mouse.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.orama.pixelorama.vm"
          package/name="Pixelorama VM"
          package/signed=true
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          permissions/read_external_storage=true
          permissions/write_external_storage=true
          permissions/read_media_images=true
          EOF

      - name: Import Project Assets & Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.home }}/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --import
          godot --headless --export-debug "AndroidAPK" build/pixelorama-virtual-mouse.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelorama-virtual-mouse-apk
          path: build/pixelorama-virtual-mouse.apk
